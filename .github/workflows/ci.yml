
name: CI Pipeline
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Build
        run: python -m compileall -q app.py test_app.py

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Test Dependency
        run: pip install -r requirements.txt

      - name: Run Tests
        run: pytest -v

  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Security Tools
        run: pip install bandit pip-audit

      - name: SAST Scan
        run: bandit -r app.py

      - name: Dependency Scan
        run: pip-audit
  
  
  docker-build:
    runs-on: ubuntu-latest
    needs: [test, security]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ashutoshojha7898/ci-cd-practice:${{ github.sha }}
  
  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build]

    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker Image
        run: |
          docker pull ghcr.io/ashutoshojha7898/ci-cd-practice:${{ github.sha }}

      - name: Deploy Container
        run: |
          docker run -d \
            --name ci-cd-app \
            -p 5000:5000 \
            ghcr.io/ashutoshojha7898/ci-cd-practice:${{ github.sha }}

      - name: Verify Deployment
        run: |
          for i in {1..15}; do
            if curl --fail http://localhost:5000/health; then
              echo "Deployment successful"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          docker logs ci-cd-app
          exit 1
